    <div class="sheet-handle"></div>
    <div class="sheet-title">카테고리 관리</div>
    <div class="faint" style="margin:-5px 0 11px;">⠿를 눌러 끌면 오늘 화면의 카테고리 순서도 함께 바뀌어.</div>
    <div class="category-manage-list" id="category-manage-list" style="margin-bottom:16px;">${items}</div>
    <div class="field-row"><input type="text" id="new-cat-name" placeholder="새 카테고리 이름"></div>
    <div class="field-row">
      <div class="field-label">색상</div>
      <div class="swatch-row" id="swatch-row">
        ${SWATCHES.map((c,i)=>`<span class="swatch ${i===0?'selected':''}" style="background:${c}" data-swatch="${c}"></span>`).join('')}
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="cat-close">닫기</button>
      <button class="btn btn-primary" id="cat-save">추가</button>
    </div>
  `);
  let selColor=SWATCHES[0];
  document.querySelectorAll('#swatch-row .swatch').forEach(sw=>{
    sw.onclick=()=>{selColor=sw.dataset.swatch;document.querySelectorAll('#swatch-row .swatch').forEach(s=>s.classList.remove('selected'));sw.classList.add('selected')};
  });
  document.getElementById('cat-close').onclick=closeSheet;
  document.getElementById('cat-save').onclick=()=>{
    const name=document.getElementById('new-cat-name').value.trim();
    if(!name){showToast('이름을 입력해줘');return;}
    state.categories.push({id:uid(),name,color:selColor,sortOrder:nextCategorySortOrder()});
    scheduleSave();renderCategorySheet();render();showToast('카테고리를 추가했어');
  };
  document.querySelectorAll('[data-edit-category]').forEach(btn=>btn.onclick=()=>openCategoryEditSheet(btn.dataset.editCategory));
  document.querySelectorAll('[data-manage-delete-category]').forEach(btn=>btn.onclick=()=>requestDeleteCategory(btn.dataset.manageDeleteCategory,renderCategorySheet));
  enableCategoryManagerDrag();
}

function openCategoryEditSheet(id){
  const cat=catById(id);if(!cat)return;
  openSheet(`
    <div class="sheet-handle"></div><div class="sheet-title">카테고리 수정</div>
    <div class="field-row"><div class="field-label">이름</div><input type="text" id="edit-cat-name" value="${escapeHtml(cat.name)}"></div>
    <div class="field-row"><div class="field-label">색상</div><div class="swatch-row" id="edit-cat-swatches">${SWATCHES.map(c=>`<span class="swatch ${cat.color===c?'selected':''}" style="background:${c}" data-swatch="${c}"></span>`).join('')}</div></div>
    <div class="sheet-actions"><button class="btn btn-ghost" id="edit-cat-cancel">취소</button><button class="btn btn-primary" id="edit-cat-save">저장</button></div>
  `);
  let color=cat.color||SWATCHES[0];
  document.querySelectorAll('#edit-cat-swatches .swatch').forEach(sw=>sw.onclick=()=>{color=sw.dataset.swatch;document.querySelectorAll('#edit-cat-swatches .swatch').forEach(s=>s.classList.remove('selected'));sw.classList.add('selected')});
  document.getElementById('edit-cat-cancel').onclick=renderCategorySheet;
  document.getElementById('edit-cat-save').onclick=()=>{
    const name=document.getElementById('edit-cat-name').value.trim();
    if(!name){showToast('이름을 입력해줘');return;}
    cat.name=name;cat.color=color;scheduleSave();renderCategorySheet();render();showToast('카테고리를 수정했어');
  };
}

function enableCategoryManagerDrag(){
  const list=document.getElementById('category-manage-list');if(!list)return;
  let drag=null;
  list.querySelectorAll('.category-drag-handle').forEach(handle=>{
    handle.onpointerdown=e=>{if(e.button>0)return;const row=handle.closest('.category-manage-item');drag={row,handle,pointerId:e.pointerId,startY:e.clientY,started:false};try{handle.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()};
    handle.onpointermove=e=>{if(!drag||e.pointerId!==drag.pointerId)return;if(!drag.started&&Math.abs(e.clientY-drag.startY)<5)return;drag.started=true;drag.row.classList.add('dragging');const under=document.elementFromPoint(e.clientX,e.clientY)?.closest?.('.category-manage-item');if(!under||under===drag.row||under.parentElement!==list)return;const rect=under.getBoundingClientRect();list.insertBefore(drag.row,e.clientY<rect.top+rect.height/2?under:under.nextSibling);e.preventDefault()};
    const finish=e=>{if(!drag||e.pointerId!==drag.pointerId)return;drag.row.classList.remove('dragging');if(drag.started){[...list.querySelectorAll('.category-manage-item')].forEach((el,i)=>{const cat=catById(el.dataset.categoryId);if(cat)cat.sortOrder=(i+1)*1000});scheduleSave();renderCategorySheet();render()}drag=null};
    handle.onpointerup=finish;handle.onpointercancel=finish;
  });
}

function openRoutineSheet(){ renderRoutineSheet(); }
function renderRoutineSheet(){
  const ordered = [...state.routines].sort((a,b)=>(Number(a.sortOrder)||0)-(Number(b.sortOrder)||0));
  const items = ordered.map(r=>{
    const days = DOW_KR.map((d,i)=>`<span style="font-size:9px;padding:2px 5px;border-radius:8px;margin-right:2px;background:${r.days.includes(i)?'var(--primary)':'var(--bg-deep)'};color:${r.days.includes(i)?'#fff':'var(--ink-faint)'};">${d}</span>`).join('');
    const periodLabel = {morning:'🌅',afternoon:'☀️',evening:'🌙'}[r.period||'morning'];
    return `<div class="routine-manage-item" data-routine-id="${r.id}">
      <span class="routine-drag-handle" aria-label="순서 변경">⠿</span>
      <div class="routine-manage-main"><div class="routine-manage-title">${periodLabel} ${escapeHtml(r.title)}</div><div style="margin-top:4px;">${days}</div></div>
      <button class="icon-btn-plain" data-edit-routine="${r.id}">✎</button>
      <button class="icon-btn-plain" data-del-routine="${r.id}">✕</button>
    </div>`;
  }).join('') || `<div class="pool-empty">등록된 루틴이 없어</div>`;
  openSheet(`
    <div class="sheet-handle"></div>
    <div class="sheet-title">루틴 관리</div>
    <div class="routine-manage-list" id="routine-manage-list" style="margin-bottom:14px;">${items}</div>
    <div class="field-row"><input type="text" id="new-rt-title" placeholder="새 루틴 이름"></div>
    <div class="field-row">
      <div class="field-label">시간대</div>
      <div class="seg-toggle" id="new-rt-period">
        <button type="button" class="seg-btn active" data-period="morning">🌅 아침</button>
        <button type="button" class="seg-btn" data-period="afternoon">☀️ 낮</button>
        <button type="button" class="seg-btn" data-period="evening">🌙 밤</button>
      </div>
    </div>
    <div class="dow-row" id="new-rt-days">${DOW_KR.map((d,i)=>`<button type="button" class="dow-btn" data-dow="${i}">${d}</button>`).join('')}</div>
    <div class="sheet-actions"><button class="btn btn-ghost" id="rt-close">닫기</button><button class="btn btn-primary" id="rt-add">추가</button></div>
  `);
  let selPeriod = 'morning';
  document.querySelectorAll('#new-rt-period .seg-btn').forEach(btn=>{ btn.onclick=()=>{ selPeriod=btn.dataset.period; document.querySelectorAll('#new-rt-period .seg-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); }; });
  const selDays = new Set();
  document.querySelectorAll('#new-rt-days .dow-btn').forEach(btn=>{ btn.onclick=()=>{ const d=Number(btn.dataset.dow); if(selDays.has(d)){selDays.delete(d);btn.classList.remove('on')}else{selDays.add(d);btn.classList.add('on')} }; });
  document.getElementById('rt-close').onclick = closeSheet;
  document.getElementById('rt-add').onclick = ()=>{
    const title=document.getElementById('new-rt-title').value.trim();
    if(!title){showToast('이름을 입력해줘');return} if(!selDays.size){showToast('요일을 선택해줘');return}
    const max=state.routines.reduce((m,x)=>Math.max(m,Number(x.sortOrder)||0),0);
    state.routines.push({id:uid(),title,days:[...selDays],period:selPeriod,sortOrder:max+1000});
    scheduleSave(); renderRoutineSheet(); render();
  };
  document.querySelectorAll('[data-edit-routine]').forEach(btn=>{ btn.onclick=()=>openRoutineEditSheet(btn.dataset.editRoutine); });
  document.querySelectorAll('[data-del-routine]').forEach(btn=>{ btn.onclick=()=>{ const id=btn.dataset.delRoutine; openConfirmSheet('이 루틴을 삭제할까?',()=>{ state.routines=state.routines.filter(r=>r.id!==id); Object.keys(state.routineCompletions).forEach(k=>{if(k.startsWith(id+'|'))delete state.routineCompletions[k]}); scheduleSave(); renderRoutineSheet(); render(); }); }; });
  enableRoutineManagerDrag();
}

function openRoutineEditSheet(id){
  const r=state.routines.find(x=>x.id===id); if(!r)return;
  openSheet(`
    <div class="sheet-handle"></div><div class="sheet-title">루틴 수정</div>
    <div class="field-row"><div class="field-label">이름</div><input id="edit-rt-title" value="${escapeHtml(r.title)}"></div>
    <div class="field-row"><div class="field-label">시간대</div><div class="seg-toggle" id="edit-rt-period">${PERIODS.map(([k,l])=>`<button type="button" class="seg-btn ${(r.period||'morning')===k?'active':''}" data-period="${k}">${l}</button>`).join('')}</div></div>
    <div class="field-row"><div class="field-label">요일</div><div class="dow-row" id="edit-rt-days">${DOW_KR.map((d,i)=>`<button type="button" class="dow-btn ${r.days.includes(i)?'on':''}" data-dow="${i}">${d}</button>`).join('')}</div></div>
    <div class="sheet-actions"><button class="btn btn-ghost" id="edit-rt-cancel">취소</button><button class="btn btn-primary" id="edit-rt-save">저장</button></div>`);
  let period=r.period||'morning'; const days=new Set(r.days);
  document.querySelectorAll('#edit-rt-period .seg-btn').forEach(b=>b.onclick=()=>{period=b.dataset.period;document.querySelectorAll('#edit-rt-period .seg-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
  document.querySelectorAll('#edit-rt-days .dow-btn').forEach(b=>b.onclick=()=>{const d=Number(b.dataset.dow);if(days.has(d)){days.delete(d);b.classList.remove('on')}else{days.add(d);b.classList.add('on')}});
  document.getElementById('edit-rt-cancel').onclick=()=>renderRoutineSheet();
  document.getElementById('edit-rt-save').onclick=()=>{const title=document.getElementById('edit-rt-title').value.trim();if(!title){showToast('이름을 입력해줘');return}if(!days.size){showToast('요일을 선택해줘');return}r.title=title;r.period=period;r.days=[...days];scheduleSave();renderRoutineSheet();render();showToast('루틴을 수정했어')};
}

function enableRoutineManagerDrag(){
  const list=document.getElementById('routine-manage-list'); if(!list)return;
  let drag=null;
  list.querySelectorAll('.routine-drag-handle').forEach(handle=>{
    handle.onpointerdown=e=>{if(e.button>0)return;const row=handle.closest('.routine-manage-item');drag={row,handle,pointerId:e.pointerId,startY:e.clientY,started:false};try{handle.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()};
    handle.onpointermove=e=>{if(!drag||e.pointerId!==drag.pointerId)return;if(!drag.started&&Math.abs(e.clientY-drag.startY)<5)return;drag.started=true;drag.row.classList.add('dragging');const under=document.elementFromPoint(e.clientX,e.clientY)?.closest?.('.routine-manage-item');if(!under||under===drag.row||under.parentElement!==list)return;const rect=under.getBoundingClientRect();list.insertBefore(drag.row,e.clientY<rect.top+rect.height/2?under:under.nextSibling);e.preventDefault()};
    const finish=e=>{if(!drag||e.pointerId!==drag.pointerId)return;drag.row.classList.remove('dragging');if(drag.started){[...list.querySelectorAll('.routine-manage-item')].forEach((el,i)=>{const r=state.routines.find(x=>x.id===el.dataset.routineId);if(r)r.sortOrder=(i+1)*1000});scheduleSave();renderRoutineSheet();render()}drag=null};
    handle.onpointerup=finish; handle.onpointercancel=finish;
  });
}

/* ================= 토스트 ================= */
let toastTimer=null;
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'), 2000);
}

/* ================= 초기화 ================= */
(async function init(){
  resetSheetState();
  await loadState();
  render();
})();
</script>
</body>
</html>
